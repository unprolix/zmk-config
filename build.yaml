# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano@2.0.0/nrf52840/zmk
#     shield: reviung41
#
# eyelash_corne is now a shield on nice_nano_v2 (shield-based ZMK architecture),
# tracked via the corne-j-keyboard-zmk fork on branch eyelash-corne-shield.
# Multiple shields are specified space-separated.
---
include:
  # Original eyelash corne
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    artifact-name: eyelash_corne_left-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    artifact-name: eyelash_corne_right-nice_view

  # Bureau variant (same keymap, different BT name)
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_bureau.conf"
    artifact-name: eyelash_corne_left_bureau-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_bureau.conf"
    artifact-name: eyelash_corne_right_bureau-nice_view

  # Lavendre variant
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_lavendre.conf"
    artifact-name: eyelash_corne_left_lavendre-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_lavendre.conf"
    artifact-name: eyelash_corne_right_lavendre-nice_view

  # Salon variant
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_salon.conf"
    artifact-name: eyelash_corne_left_salon-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_salon.conf"
    artifact-name: eyelash_corne_right_salon-nice_view

  # beekeeb Toucan2 36-key (shield vendored in config/boards/shields/toucan;
  # trackpad driver modules pinned in config/west.yml)
  - board: xiao_ble/nrf52840/zmk
    shield: toucan_left toucan_display
    artifact-name: toucan_left-display
  - board: xiao_ble/nrf52840/zmk
    shield: toucan_right
    artifact-name: toucan_right

  # TEMPORARY: adds the raw-HID bootloader trigger to the Toucan. See
  # config/boards/shields/dfu -- this is a development convenience and is
  # meant to be removed, not shipped. Both halves live on plaquette and the
  # trackpad is dead pending an RMA, so every flash cycle here is remote.
  #
  # The trigger is central-only (RAW_HID depends on ZMK_SPLIT_ROLE_CENTRAL);
  # the right half carries the shield anyway so both sides of a cycle come
  # from the same pair of lines, and so the peripheral is never left on a
  # build whose central cannot relay &bootloader to it.
  - board: xiao_ble/nrf52840/zmk
    shield: toucan_left toucan_display dfu
    artifact-name: toucan_left-dfu
  - board: xiao_ble/nrf52840/zmk
    shield: toucan_right dfu
    artifact-name: toucan_right-dfu

  # Rolio46 Gen2 / "Rolio Three" (board + shields vendored in config/boards;
  # forward-ported from MickiusMousius/Rolio2Firmware @ choc2-revision1)
  - board: rolio3/nrf52840/zmk
    shield: rolio_left vista508
    artifact-name: rolio_left-vista508
  - board: rolio3/nrf52840/zmk
    shield: rolio_right
    artifact-name: rolio_right
  - board: rolio3/nrf52840/zmk
    shield: settings_reset
    artifact-name: rolio3-settings_reset

  # One-off RGB calibration build -- works out which LED sits under which key.
  # NOT for daily use: it takes over the LED strip, swallows keypresses and
  # types its findings out. See config/boards/shields/rgbcal.
  - board: rolio3/nrf52840/zmk
    shield: rolio_left vista508 rgbcal
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbcal_rolio.conf"
    artifact-name: rolio_left-rgbcal
  - board: rolio3/nrf52840/zmk
    shield: rolio_right rgbcal
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbcal_rolio.conf"
    artifact-name: rolio_right-rgbcal

  # Per-key lighting: held home-row mods in their signature colour, plus the
  # gaming and navigation key groups. See config/boards/shields/rgbkey.
  - board: rolio3/nrf52840/zmk
    shield: rolio_left vista508 rgbkey
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbkey_rolio.conf"
    artifact-name: rolio_left-rgbkey
  - board: rolio3/nrf52840/zmk
    shield: rolio_right rgbkey
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbkey_rolio.conf"
    artifact-name: rolio_right-rgbkey

  # Other boards
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_ergomech_left
    artifact-name: sofle_ergomech_left-nice_nano_v2
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_ergomech_right
    artifact-name: sofle_ergomech_right-nice_nano_v2

  # Fuligin variant
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_fuligin.conf"
    artifact-name: eyelash_corne_left_fuligin-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_fuligin.conf"
    artifact-name: eyelash_corne_right_fuligin-nice_view

  # Xan variant (same hardware as fuligin)
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_xan.conf"
    artifact-name: eyelash_corne_left_xan-nice_view
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/eyelash_corne_xan.conf"
    artifact-name: eyelash_corne_right_xan-nice_view

  # One-off RGB calibration build -- works out which LED sits under which key.
  # NOT for daily use: it takes over the LED strip, swallows keypresses and
  # types its findings out. See config/boards/shields/rgbcal.
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbcal
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbcal_lavendre.conf"
    artifact-name: eyelash_corne_left_lavendre-rgbcal
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbcal
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbcal_lavendre.conf"
    artifact-name: eyelash_corne_right_lavendre-rgbcal

  # Per-column layer indication (RGB is per-column on this board, not per-key).
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_lavendre.conf"
    artifact-name: eyelash_corne_left_lavendre-rgbzone
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_lavendre.conf"
    artifact-name: eyelash_corne_right_lavendre-rgbzone

  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_bureau.conf"
    artifact-name: eyelash_corne_left_bureau-rgbzone
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_bureau.conf"
    artifact-name: eyelash_corne_right_bureau-rgbzone

  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_salon.conf"
    artifact-name: eyelash_corne_left_salon-rgbzone
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_salon.conf"
    artifact-name: eyelash_corne_right_salon-rgbzone

  # TEMPORARY: adds the raw-HID bootloader trigger to the bureau. The bureau
  # had deliberately gone without it -- it is the pair most often used as a
  # keyboard rather than as a test rig -- but the diagnostics ride the same
  # channel, and without them a layer that will not activate cannot be watched.
  # Drop these two entries once the sticky hold-taps are settled.
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_bureau.conf"
    artifact-name: eyelash_corne_left_bureau-dfu
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_bureau.conf"
    artifact-name: eyelash_corne_right_bureau-dfu

  # TEMPORARY: adds the raw-HID bootloader trigger to the lavendre. See
  # config/boards/shields/dfu -- this is a development convenience and is
  # meant to be removed, not shipped.
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_lavendre.conf"
    artifact-name: eyelash_corne_left_lavendre-dfu
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_lavendre.conf"
    artifact-name: eyelash_corne_right_lavendre-dfu

  # TEMPORARY: adds the raw-HID bootloader trigger to the Rolio. See
  # config/boards/shields/dfu -- this is a development convenience and is
  # meant to be removed, not shipped. Kept as its own targets so the ordinary
  # rgbkey builds above stay free of it.
  #
  # The trigger itself is central-only (RAW_HID depends on
  # ZMK_SPLIT_ROLE_CENTRAL), but the right half is built to match so that both
  # sides of a flash cycle come from the same pair of lines. The peripheral
  # needs no code: the central relays &bootloader to it, and behavior_reset's
  # EVENT_SOURCE locality lands it on the correct half.
  - board: rolio3/nrf52840/zmk
    shield: rolio_left vista508 rgbkey dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbkey_rolio.conf"
    artifact-name: rolio_left-dfu
  - board: rolio3/nrf52840/zmk
    shield: rolio_right rgbkey dfu
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbkey_rolio.conf"
    artifact-name: rolio_right-dfu

  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_left nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_fuligin.conf"
    artifact-name: eyelash_corne_left_fuligin-rgbzone
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: eyelash_corne_right nice_view nice_view_jjb rgbzone
    cmake-args: -DZMK_EXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/rgbzone_fuligin.conf"
    artifact-name: eyelash_corne_right_fuligin-rgbzone

  # Settings reset (universal across both sides)
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: settings_reset
    artifact-name: nice_nano_v2-settings_reset
