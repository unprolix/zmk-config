# Per-key lighting build for the Rolio.
#
# Everything here exists to stop something else touching the LED chain or its
# power gate behind rgbkey's back. The config directory outranks a shield's
# .conf, so these have to be applied as an EXTRA_CONF_FILE to beat rolio.conf.

# Underglow stays COMPILED IN -- disabling it in Kconfig also removes the things
# it selects (LED_STRIP, the WS2812 SPI backend, SPI, the ext-power wiring), so
# the chain would end up with no driver and rolio.conf's own underglow settings
# would then abort the build as unmet dependencies. rgbkey takes the strip at
# runtime instead.
CONFIG_ZMK_RGB_UNDERGLOW=y

# ...but it must never start, and must never come BACK. Calling
# zmk_rgb_underglow_off() once is not enough on its own: with AUTO_OFF_IDLE the
# underglow restores whatever it was doing before the keyboard went idle, so it
# returns at the next keypress and animates over rgbkey's writes. Two writers on
# one chain shows up as the right key lighting in the wrong colour at a
# wandering brightness, not as an error.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# The "backlight" PWM on P1.13 is the LED chain's power gate on this board, and
# rgbkey owns it: it opens the gate only while something is lit, so an all-dark
# layer already costs nothing and ZMK's own idle handling is not needed.
#
# Worse, ZMK's auto-off would close the gate WITHOUT going through rgbkey, whose
# cached idea of the gate state would still read "open" -- so the next write
# after an idle wake would be clocked into an unpowered chain and silently lost.
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n

# Appended by scripts/adjust_leader_config.sh; kept here so it does not re-add
# a copy after every CONFIG_ZMK_ line the next time it sees this file.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=132
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118
