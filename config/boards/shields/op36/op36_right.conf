CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep only matters with the Qube gone: zmk-smart-sleep holds a
# peripheral awake for as long as its link to the central is up.
CONFIG_ZMK_SLEEP=y

# ...and sleeps this long after the link goes away. The module's 15 s is
# shorter than a Qube reflash (copy plus reboot is ~20 s), so every hands-free
# flash of the Qube put both halves to sleep, needing a keypress each.
CONFIG_ZMK_SPLIT_PERIPHERAL_DISCONNECT_SLEEP_TIMEOUT=300000
