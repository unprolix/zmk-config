# USB-powered and battery-less: never sleeps.
CONFIG_ZMK_SLEEP=n

# No peripheral latency, on measured evidence.
#
# ZMK's default of 30 lets a half skip up to 30 connection events, so it must
# wake within a window sized by both ends' clock accuracy -- and these modules
# have no 32 kHz crystal, only the internal RC oscillator.
#
# Measured 2026-09-16/17. Under latency 0 the RIGHT half held one link for 21
# hours without a single drop. Ten minutes after reverting to 30 it had 11
# failed encryption handshakes and 19 drops, and the left half was flapping in
# both cases. So latency 30 destabilises even the good half here; latency 0
# costs that half some battery and is plainly worth it.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# The supervision timeout stays at ZMK's 4 s default: raising it to 10 s
# changed nothing except how long a dead link lingered.

# The halves' levels reach the host through the central's battery proxy, and
# ZMK only compiles the peripheral battery event under ZMK_BATTERY_REPORTING --
# leave it off and the central fails to link. With no zmk,battery chosen, the
# Qube's own reporting finds no sensor and never starts.
CONFIG_ZMK_BATTERY_REPORTING=y

# ...but BATTERY_REPORTING implies the Qube's own Battery Service, which would
# advertise a battery it does not have, stuck at 0%. The proxy defines its own
# service for the halves and does not need this one.
CONFIG_BT_BAS=n
