# Corne v4 left half (split central).
#
# The polling-mode line below is duplicated in corne_v4_right.conf: a .conf
# cannot include another, so when it moves, move it in both.

# uart_pio_half_duplex.c implements poll_in/poll_out and nothing else, so the
# wired transport must not reach for the async (DMA) or interrupt APIs. Zephyr
# would otherwise default to async here, and the link would simply never start.
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_POLLING=y

# The two halves enumerate under different names on purpose. An RP2040 in
# BOOTSEL offers nothing that says which half it is, so the flash script has to
# take that on trust from --left/--right; distinct names are what let it check
# afterwards that the right image landed on the right board.
CONFIG_ZMK_KEYBOARD_NAME="Corne v4"

# Drain the RX FIFO every 2 ticks (200us) instead of 10 (1ms). The PIO receive
# FIFO is only 8 bytes deep and ZMK empties it by polling, so the poll period --
# not the baud rate -- is what caps the link. Too slow and the tail of every
# reply is dropped into a fragment that can never parse, and a stuck fragment is
# not merely lossy: zmk_split_wired_poll_in() resubmits publish_events_work
# whenever rx_buf is non-empty, and that work reschedules rx_done_work. So one
# unparseable fragment pushes the poller 20ms into the future on every tick and
# the transport stops for good, which is exactly how this presented -- counters
# frozen mid-conversation with the driver idle and healthy.
CONFIG_ZMK_SPLIT_WIRED_POLLING_RX_PERIOD=2
