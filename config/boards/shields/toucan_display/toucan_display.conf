CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# WARNING: this shield COMPILES ../vista508/custom_status_screen.c. Any font or
# LVGL feature that file starts using must be added here too, or the Toucan stops
# building while the Rolio is fine -- which is exactly how the montserrat_18
# breakage on 2026-08-27 happened. Diff the two confs when either changes.
#
# Everything below mirrors config/boards/shields/vista508/vista508.conf, which
# is the same 144x168 panel running the same status screen. Kept as its own
# file rather than shared because a .conf cannot include another, and because
# the two shields may yet diverge (the Rolio's panel is mounted upside down and
# needs the vendor driver's rotate-180; this one does not).
#
# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN carries a set of select/imply lines that
# ZMK_DISPLAY_STATUS_SCREEN_CUSTOM does NOT. Choosing the custom screen
# silently drops all of them, which is why the panel comes up blank: without
# LV_USE_THEME_MONO, ZMK's initialize_theme() compiles to nothing and the
# labels get no colours on a 1-bit display. Everything the built-in option
# implied has to be requested explicitly here.
CONFIG_LV_USE_THEME_MONO=y
# WPM is OFF at jjb's request, matching vista508. Every line that lays it out
# is still in custom_status_screen.c behind IS_ENABLED(CONFIG_ZMK_WIDGET_WPM_STATUS),
# so flipping this to =y restores the readout.
CONFIG_ZMK_WIDGET_WPM_STATUS=n

CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y

# LVGL's pool defaults to 4096, which is not enough for this panel's widgets
# (2.2x a nice!view's pixels) and shows up as garbled icons. Set here rather
# than as a Kconfig default, which loses to an earlier default elsewhere.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The emblem and the modifier glyphs are drawn on canvases, and the canvas
# widget is not part of what ZMK asks for. Without this, lvgl.h never pulls in
# lv_canvas.h, LV_CANVAS_BUF_SIZE silently degrades to an implicit function
# call, and the buffer declarations fail as "variably modified at file scope"
# rather than as anything mentioning canvases.
CONFIG_LV_USE_CANVAS=y
# ZMK selects LV_USE_LABEL only via LV_OBJ_LABEL, which is undefined in this
# LVGL version, so the select is a no-op. Ask for it directly.
CONFIG_LV_USE_LABEL=y

# The status readouts sit in the corners the emblem leaves blank, which are
# only about 60px wide -- at the default 20px face "BT2 ok" alone overruns one.
CONFIG_LV_FONT_MONTSERRAT_14=y
# 14 was too thin to survive 1-bit thresholding even overdrawn; the corner
# readouts use 16, and the screen also asks for 18.
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
