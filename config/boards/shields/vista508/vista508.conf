CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN carries a set of select/imply lines that
# ZMK_DISPLAY_STATUS_SCREEN_CUSTOM does NOT. Choosing the custom screen
# silently drops all of them, which is why the panel came up blank: without
# LV_USE_THEME_MONO, ZMK's initialize_theme() compiles to nothing and the
# labels get no colours on a 1-bit display. Everything the built-in option
# implied has to be requested explicitly here.
# (LV_OBJ_LABEL is undefined in this LVGL version, so ZMK's select on it is a
# no-op and the label object is always built. ZMK_WIDGET_PERIPHERAL_STATUS
# depends on !ZMK_SPLIT_ROLE_CENTRAL and only the central has a display here,
# so it is deliberately not requested.)
CONFIG_LV_USE_THEME_MONO=y
# Layer name is drawn by this shield's own widget (ZMK's truncates at 14 bytes).
# Connection and battery are drawn by this shield's own widgets (legible text
# rather than ZMK's compact LVGL glyphs), so ZMK's versions are not built.
# WPM is OFF at jjb's request, until further notice. Turned off HERE rather
# than by deleting the widget: every line that lays it out is still in
# custom_status_screen.c behind IS_ENABLED(CONFIG_ZMK_WIDGET_WPM_STATUS), so
# flipping this back to =y restores the bottom-right readout exactly as it was.
CONFIG_ZMK_WIDGET_WPM_STATUS=n

CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y

# LVGL's pool defaults to 4096, which is not enough for this panel's widgets
# (2.2x a nice!view's pixels) and shows up as garbled icons. Set here rather
# than as a Kconfig default, which loses to an earlier default elsewhere.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The fork's VCOM thread defaults to priority 3; the toucan build uses 11 and
# there is no reason for this one to run hotter. Set here because a Kconfig
# default loses to an earlier default elsewhere.
CONFIG_LS0XX_VCOM_THREAD_PRIO=11

# The emblem and the modifier glyphs are drawn on canvases, and the canvas
# widget is not part of what ZMK asks for. Without this, lvgl.h never pulls in
# lv_canvas.h, LV_CANVAS_BUF_SIZE silently degrades to an implicit function
# call, and the buffer declarations fail as "variably modified at file scope"
# rather than as anything mentioning canvases.
CONFIG_LV_USE_CANVAS=y
# ZMK selects LV_USE_LABEL only via LV_OBJ_LABEL, which is undefined in this
# LVGL version, so the select is a no-op. Ask for it directly.
CONFIG_LV_USE_LABEL=y

# The corner readouts. 18 rather than the 20px default, which "BT2 unpaired"
# would run off the panel with; and rather than 14 or 16, which were tried
# first and are too thin to survive 1-bit thresholding even overdrawn.
#
# This is the ONLY face the screen names explicitly -- the middle band takes
# the 20px default above -- so 14 and 16 were carried here for nothing until
# 2026-08-27. If a readout changes size, change the #error in
# custom_status_screen.c to match, and mirror both in toucan_display.conf.
CONFIG_LV_FONT_MONTSERRAT_18=y

# Blank the panel when ZMK goes idle.
#
# Worth far more than "the screen turns off". The ls0xxvcom driver reaches its
# idle-vcom-interval (1000ms) ONLY from blanking_on(); without this the panel
# sits on serial-vcom-interval (17ms) forever, so an untouched keyboard wakes
# the CPU some sixty times a second to toggle VCOM. The toggle itself takes
# under 0.1ms -- the cost is the wakeup, roughly 3-5mA for about 1ms each time.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
