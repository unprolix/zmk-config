CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN carries a set of select/imply lines that
# ZMK_DISPLAY_STATUS_SCREEN_CUSTOM does NOT. Choosing the custom screen
# silently drops all of them, which is why the panel came up blank: without
# LV_USE_THEME_MONO, ZMK's initialize_theme() compiles to nothing and the
# labels get no colours on a 1-bit display. Everything the built-in option
# implied has to be requested explicitly here.
# (LV_OBJ_LABEL is undefined in this LVGL version, so ZMK's select on it is a
# no-op and the label object is always built. ZMK_WIDGET_PERIPHERAL_STATUS
# depends on !ZMK_SPLIT_ROLE_CENTRAL and only the central has a display here,
# so it is deliberately not requested.)
CONFIG_LV_USE_THEME_MONO=y
# Layer name is drawn by this shield's own widget (ZMK's truncates at 14 bytes).
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# LVGL's pool defaults to 4096, which is not enough for this panel's widgets
# (2.2x a nice!view's pixels) and shows up as garbled icons. Set here rather
# than as a Kconfig default, which loses to an earlier default elsewhere.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The fork's VCOM thread defaults to priority 3; the toucan build uses 11 and
# there is no reason for this one to run hotter. Set here because a Kconfig
# default loses to an earlier default elsewhere.
CONFIG_LS0XX_VCOM_THREAD_PRIO=11
