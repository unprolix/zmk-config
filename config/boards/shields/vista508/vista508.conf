CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Built-in status screen sizing for the larger panel.
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# LVGL's pool defaults to 4096, which is not enough for this panel's widgets
# (2.2x a nice!view's pixels) and shows up as garbled icons. Set here rather
# than as a Kconfig default, which loses to an earlier default elsewhere.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The fork's VCOM thread defaults to priority 3; the toucan build uses 11 and
# there is no reason for this one to run hotter. Set here because a Kconfig
# default loses to an earlier default elsewhere.
CONFIG_LS0XX_VCOM_THREAD_PRIO=11
