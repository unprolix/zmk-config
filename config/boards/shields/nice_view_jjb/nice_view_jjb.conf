# Replace nice_view's canvas status widget with this shield's screen.
#
# nice_view's Kconfig.defconfig says `ZMK_DISPLAY_STATUS_SCREEN_CUSTOM imply
# NICE_VIEW_WIDGET_STATUS`, and its CMakeLists compiles its own
# zmk_display_status_screen() whenever that symbol is set. Two definitions of
# that function is a duplicate-symbol link error, so nice_view's has to go.
# `imply` is a weak default and an explicit assignment here overrides it.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN carries a set of select/imply lines that
# ZMK_DISPLAY_STATUS_SCREEN_CUSTOM does NOT. Picking the custom screen silently
# drops all of them -- most importantly LV_USE_THEME_MONO, without which ZMK's
# initialize_theme() compiles to nothing and every label renders with no
# contrast on a 1-bit panel. Symptom is a blank screen and a clean boot log.
CONFIG_LV_USE_THEME_MONO=y

# Turning off NICE_VIEW_WIDGET_STATUS also drops the fonts it selected: 12 for
# the leader list and WPM, 14 for connection/battery/layer, 18 for the
# peripheral's battery figure.
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# ...and LV_USE_CANVAS, which both screens depend on. The panel's framebuffer
# is 160x68 while its readable orientation is 68x160, and LVGL cannot rotate a
# 1-bit display (lv_draw_sw_rotate has no I1 path), so every band is drawn into
# an off-screen L8 canvas and rotated before it is blitted down to 1 bit.
CONFIG_LV_USE_CANVAS=y

# Every widget on both screens is a plain lv_label, and nothing else in this
# build guarantees the label object exists: ZMK pulls LV_USE_LABEL in only via
# `select` on its own widgets (app/src/display/widgets/Kconfig), and the
# peripheral screen uses none of those. Without it lv_label.h is never included
# and the calls fail as implicit declarations.
CONFIG_LV_USE_LABEL=y

# WPM was selected by NICE_VIEW_WIDGET_STATUS on the central; the central screen
# still shows it. Ask for the *widget* symbol, not CONFIG_ZMK_WPM: the widget is
# what the screen's #if guards on, and it selects ZMK_WPM itself.
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Without this the central never learns the peripheral's charge, so the battery
# line can only ever say "L<n>" and never "L<n> R<n>". It also gives the only
# signal the central gets that a peripheral is alive -- ZMK raises
# zmk_split_peripheral_status_changed on the peripheral only -- which is what
# prompts a re-send of the relayed display state after a connect.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
