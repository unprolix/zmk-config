# Raw HID is how the host reaches the firmware. The module is already vendored
# and pinned in west.yml; it is central-only by its own Kconfig dependency,
# which suits this: the peripheral needs no new code at all, because the
# central relays &bootloader to it through machinery ZMK already has.
CONFIG_RAW_HID=y

# The raw interface is a SECOND USB HID device; RAW_HID_DEVICE defaults to
# HID_1. Without raising the count that instance never exists, RAW_HID compiles
# happily, and the keyboard enumerates with its usual single interface -- no
# error anywhere, just nothing for the host to talk to.
CONFIG_USB_HID_DEVICE_COUNT=2
