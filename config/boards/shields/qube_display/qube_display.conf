# Qube status screen. Everything the panel cannot work without is set here as
# well as in Kconfig.defconfig: a shield default loses to an earlier default
# elsewhere, and a .conf assignment does not.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Off the system workqueue, like every other board here with a panel.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# The Qube is USB-powered and its screen is how you find out why nothing is
# typing -- which is exactly when ZMK would call it idle. Keep it lit.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_HID_INDICATORS=y

# RGB565, byte-swapped: LVGL renders little-endian and the ST7789V reads
# big-endian. LVGL 9.3 still honours LV_COLOR_16_SWAP in lv_refr.c.
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_16_SWAP=y

# A quarter-frame render buffer: 280x240 RGB565 is 134 KB, and the whole
# nRF52840 has 256.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_MEM_POOL_SIZE=24576

# ZMK's custom-screen choice selects none of these; name every one.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_CANVAS=y
# The emblem is a greyscale (L8) image LVGL rotates; the modifier row is an
# ARGB8888 canvas, so its glyphs sit on the art instead of in a hole cut out
# of it.
CONFIG_LV_DRAW_SW_SUPPORT_L8=y
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888=y

CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
# The layer name is the biggest thing on the panel and gets the 28px face.
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# The emblem turns, which means transforming it, which LVGL's software
# renderer only does for a handful of formats -- L8 among them, which is why
# the emblem is L8 and not the 1-bit indexed image it started as.
CONFIG_LV_BIN_DECODER_RAM_LOAD=n
