# Rolio46 Gen2 / "Rolio Three" — shared-layout build.
# Display, trackpad and per-half settings live in the vendored shield confs
# (config/boards/shields/rolio/rolio_{left,right}.conf and .../vista508).

# Zephyr 4.1.0 routes BT crypto through PSA; enable mbedtls PSA crypto client
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Some symbols are deprecated in Zephyr 4.1.0 but ZMK still uses them.
CONFIG_WARN_DEPRECATED=n

# Workqueue stack overflows when combos fire chains of sticky-key → hold-tap →
# macro (ZMK upstream issue #3100); same bump as the eyelash_corne config.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

CONFIG_ZMK_KEYBOARD_NAME="Rolio Three"
CONFIG_BT_DEVICE_NAME="Rolio Three"

# NKRO causes problems over bluetooth (same as eyelash_corne).
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_LEADER_MAX_SEQUENCES=134

# Roller encoders, one per half. The vendor ships a patched EC11 driver
# (MickiusMousius/zmk-patch-ec11) that claims to miss fewer pulses; this uses
# ZMK's in-tree driver so no extra module is needed.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Cirque trackpad on the right half.
CONFIG_ZMK_MOUSE=y

# Underglow: 23 WS2812 per half on spi2.
# WS2812_STRIP was split into per-bus symbols in Zephyr 4.1.0.
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=4
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=1
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=2

# The "backlight" PWM channel is the underglow power gate, not an LED.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_BRT_STEP=100
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Power management. Sleep after an hour, matching the eyelash_corne config.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_PM_SOFT_OFF=y

# Battery reporting, including the peripheral half's level.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Force Windows to show battery
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Longer range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Macros enqueue two behaviour-queue slots per binding (press + release, since
# MACRO_MODE_TAP is the default). The address macros are long enough to overrun
# the default queue of 64 and lose their tails -- home_address_web needs 82
# slots and never reached the phone number; address_california needs 86.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

# BLE: take upstream's experimental connection and security settings, but NOT
# the passkey flow they drag in behind them.
#
# EXPERIMENTAL_FEATURES is two useful things at this ZMK revision -- and it has
# no C code behind it at all, only Kconfig:
#
#   BT_CTLR_PHY_2M goes OFF. Bluetooth 5's 2 Mbit PHY halves airtime, but
#   enough hosts negotiate it badly that ZMK plans to default it off; the
#   symptom is a connection that drops rather than one that never forms.
#
#   BT_SMP_ALLOW_UNAUTH_OVERWRITE goes ON, which lets a fresh unauthenticated
#   bond replace an existing one. That is the cure for a host that has
#   forgotten the keyboard while the keyboard still holds the bond, which
#   otherwise needs the profile cleared by hand first.
#
# The third thing it enables is ZMK_BLE_PASSKEY_ENTRY, and it arrives
# unannounced through two chained implies: EXPERIMENTAL_SEC implies
# BT_SMP_ALLOW_UNAUTH_OVERWRITE, which ZMK gives `imply ZMK_BLE_PASSKEY_ENTRY`.
# It would make pairing require typing a six-digit code and Enter. Workable --
# the HOST shows the digits -- but on hierophant the digits are not on the base
# layer, so it means reaching for NUM in the middle of pairing. The vendor
# hides that by auto-activating a numpad layer during pairing, which is what
# their zmk-ble-passkey module is for and which we do not have.
#
# An explicit =n overrides an imply, so this takes the first two and declines
# the third. Turn it on deliberately if you ever want passkey pairing.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
