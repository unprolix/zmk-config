# Ergohaven Omega Point 36 + Qube dongle, shared-layout build.
# Split roles, battery and sleep live in the vendored shield
# (config/boards/shields/op36).

# Zephyr 4.1.0 routes BT crypto through PSA; enable mbedtls PSA crypto client
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Some symbols are deprecated in Zephyr 4.1.0 but ZMK still uses them.
CONFIG_WARN_DEPRECATED=n

# Workqueue stack overflows when combos fire chains of sticky-key → hold-tap →
# macro (ZMK upstream issue #3100); same bump as the other boards.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# NKRO drops F13-F24 and misbehaves over bluetooth; HKRO like the other boards.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# +8 dBm, as Ergohaven's own ZMK board sets it.
#
# It was first set against the link drops, and it did NOT fix them -- those were
# one-sided BLE bonds, cured by a settings_reset on all three. Kept anyway, on
# the vendor's precedent and on the measurement that prompted it: at the 0 dBm
# default the halves reached the Qube at -61 to -78 dBm across a desk, which is
# little margin for a link whose loss is the whole keyboard.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_LEADER_MAX_SEQUENCES=135
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118
