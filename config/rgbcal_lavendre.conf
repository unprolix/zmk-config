# Calibration build for the lavendre.
#
# This exists as its own file rather than as the rgbcal shield's .conf because
# config/eyelash_corne.conf sets CONFIG_ZMK_RGB_UNDERGLOW=y, and the config
# directory's conf outranks a shield's -- so the shield could not turn it off.
# An EXTRA_CONF_FILE is applied last and wins.

CONFIG_ZMK_KEYBOARD_NAME="Eyelash Lavendre"
CONFIG_ZMK_LEADER_MAX_SEQUENCES=132

CONFIG_USB_DEVICE_MANUFACTURER="jjb"
CONFIG_USB_DEVICE_PRODUCT="Eyelash Lavendre"
CONFIG_USB_DEVICE_VID=0xBEEF
CONFIG_USB_DEVICE_PID=0xC0DA

CONFIG_BT_DEVICE_NAME="Lavendre Corne"

# Underglow is deliberately LEFT ENABLED here. Disabling it in Kconfig also
# removes the things it selects -- LED_STRIP, the WS2812 SPI backend, SPI, and
# the external-power wiring -- so the chain ends up with no driver at all, and
# eyelash_corne.conf's underglow settings then warn as unmet dependencies and
# abort the build. Far simpler to let it build and call
# zmk_rgb_underglow_off() at runtime, which stops its tick and hands the strip
# over. It also cuts external power on the way out, which rgbcal_strip.c turns
# back on.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118
