# Corne v4 bring-up logging. Extra conf for the -debug targets, paired with the
# zmk-usb-logging snippet -- the snippet supplies the zephyr,cdc-acm-uart node
# and the console chosen-nodes, which is why this file does not set
# CONFIG_ZMK_USB_LOGGING itself. Setting that alone does not work here: the
# rpi_pico board disables uart0, so with no CDC node in the devicetree Kconfig
# fails outright on USB_CDC_ACM and UART_CONSOLE being selected without their
# dependencies.
#
# Use it one half at a time: whichever half holds the USB cable powers the other
# over the interlink, so there is never a reason -- and never permission -- to have
# both halves on USB at once.
#
# What to look for, with the wired split silent:
#
#   central  "TX Bytes" hexdumps every ~15ms, and a turnaround line whose rx
#            count stays 0  -> the central is talking and hearing nothing back
#   periph   a turnaround line whose rx count stays 0
#            -> nothing is arriving; suspect the wire, the pin, or the baud
#   periph   rx climbing but no reply
#            -> bytes arrive but the frame is rejected; suspect CRC, i.e.
#               framing/timing rather than connectivity
#
# The driver's own init line reports the pin, baud and clock divider it actually
# came up with, which is worth confirming before reading anything into silence.

# INF, not DBG. At DBG the behaviour-init chatter alone dropped 577 messages at
# boot and buried the split driver's own init line; the interesting lines are
# precisely the ones that get lost. The driver reports its counters at INF on a
# timer instead, which says everything the DBG hexdumps would.
# BOTH SYMBOLS ARE NEEDED, and the choice on its own does NOTHING.
# LOG_MODULE_DECLARE(zmk, CONFIG_ZMK_LOG_LEVEL) compiles against the integer,
# and zmk/app/Kconfig:555 has
#
#     if !ZMK_LOGGING_MINIMAL
#     config ZMK_LOG_LEVEL
#         default 4        # 4 == DBG
#     endif
#
# whose default is reached before the log_config template's `default 3 if
# ZMK_LOG_LEVEL_INF`, so a build setting only the choice still comes out at DBG
# -- .config read `CONFIG_ZMK_LOG_LEVEL=4` with `CONFIG_ZMK_LOG_LEVEL_INF=y`
# directly above it. The integer cannot be assigned here either; it is
# promptless, and Kconfig fails the build outright. ZMK_LOGGING_MINIMAL is the
# switch: it drops the `default 4` and lets the choice decide.
#
# What DBG costs on this board: the wired split's poll_out hexdump runs at
# ~66Hz, which is 83000 lines in five minutes, and the deferred backend drops
# everything else -- including every line these files exist to read.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

# The split transport hexdumps at debug level and the log backend is slower than
# the traffic; without room here the interesting lines are the ones dropped.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_DEFERRED=y

# Declared, not because this file needs them -- corne_v4.conf already sets both
# -- but because scripts/adjust_leader_config.sh rewrites every config/*.conf,
# and its "symbol absent" path is `sed /CONFIG_ZMK_.*=/a`, which appends after
# EVERY matching line rather than once. Having the symbols already present sends
# it down the substitute path instead, so this file stops accumulating copies.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=134
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118
