# This file specifies the build dependencies for Github Action workflows and
# for local build environments. The workspace has four toplevel directories
# containing the user config, modules, zephy and ZMK.
#
# ZMK-Workspace
# ├── config
# ├── modules
# ├── zephyr
# └── zmk
#
# To create a local build environment, clone this repository and then run the
# following commands from its toplevel directory:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
#
---
manifest:
  defaults:
    remote: urob
    revision: main # Upgraded from v0.3.0

  remotes:
    - name: urob
      url-base: https://github.com/urob
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    # for eyelash_corne
    - name: a741725193
      url-base: https://github.com/a741725193

    # for ergomech.store sofle hybrid
    - name: ergomechstore
      url-base: https://github.com/ergomechstore

    # for rolio2
    - name: rolio2
      url-base: git@github.com:MickiusMousius

    # for usb raw hid (not yet used)
    - name: zzeneg
      url-base: https://github.com/zzeneg

    # for default layer behavior
    - name: elpekenin
      url-base: https://github.com/elpekenin

    # for antecedent-morph
    - name: ssbb
      url-base: https://github.com/ssbb

    # user fork: holds HWMv2 migration of eyelash_corne and Zephyr 4.1.0 fixes
    - name: unprolix
      url-base: https://github.com/unprolix

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml

    # for eyelash_corne (user fork tracking upstream shield-based architecture;
    # the HWMv2 board form lives on branch eyelash-corne-hwmv2 if rollback is needed)
    - name: corne-j-keyboard-zmk
      remote: unprolix
      path: zmk-new_corne
      revision: eyelash-corne-shield

    # for sofle hybrid (user fork: WS2812_STRIP fix for Zephyr 4.1.0)
    - name: sofle-hybrid-ergomech-zmk
      remote: unprolix
      path: modules/vendors/ergomech-sofle
      revision: zephyr-4.1-ws2812-fix

    - name: Rolio2Firmware
      remote: rolio2
      path: modules/vendors/rolio2
      revision: main

    # for default layer
    - name: zmk-userspace
      remote: elpekenin
      revision: main
      path: modules/zmk/zmk-userspace

    - name: zmk-adaptive-key
      path: modules/zmk/adaptive-key
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
    - name: zmk-helpers
      path: modules/zmk/helpers
    - name: zmk-leader-key
      path: modules/zmk/leader-key
    - name: zmk-tri-state
      path: modules/zmk/tri-state
    - name: zmk-unicode
      path: modules/zmk/unicode

    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
      path: modules/zmk/zmk-raw-hid

    - name: zmk-antecedent-morph
      remote: ssbb
      revision: v1.0.1
      path: modules/zmk/zmk-antecedent-morph

    # Only source necessary Zephyr modules. Remove this entire section to restore
    # the default (needed for less common hardware).
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - hal_rpi_pico
          - hal_stm32
          - lvgl
          - mbedtls   # required by BT_CRYPTO in Zephyr 4.1.0
          - tinycrypt

  self:
    path: config
