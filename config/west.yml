# This file specifies the build dependencies for Github Action workflows and
# for local build environments. The workspace has four toplevel directories
# containing the user config, modules, zephy and ZMK.
#
# ZMK-Workspace
# ├── config
# ├── modules
# ├── zephyr
# └── zmk
#
# To create a local build environment, clone this repository and then run the
# following commands from its toplevel directory:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
#
---
manifest:
  defaults:
    remote: urob
    revision: main # Upgraded from v0.3.0

  remotes:
    - name: urob
      url-base: https://github.com/urob
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    # for eyelash_corne
    - name: a741725193
      url-base: https://github.com/a741725193

    # for ergomech.store sofle hybrid
    - name: ergomechstore
      url-base: https://github.com/ergomechstore


    # for usb raw hid (not yet used)
    - name: zzeneg
      url-base: https://github.com/zzeneg

    # for default layer behavior
    - name: elpekenin
      url-base: https://github.com/elpekenin

    # for antecedent-morph
    - name: ssbb
      url-base: https://github.com/ssbb

    # user fork: holds HWMv2 migration of eyelash_corne and Zephyr 4.1.0 fixes
    - name: unprolix
      url-base: https://github.com/unprolix

    # for toucan2 trackpad (azoteq tps43 driver + zoom input processor)
    - name: beekeeb
      url-base: https://github.com/beekeeb

    # for the Rolio's Sharp display driver fork (adds rotate-180)
    - name: mickiusmousius
      url-base: https://github.com/MickiusMousius

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml

    # for eyelash_corne (user fork tracking upstream shield-based architecture;
    # the HWMv2 board form lives on branch eyelash-corne-hwmv2 if rollback is needed)
    - name: corne-j-keyboard-zmk
      remote: unprolix
      path: zmk-new_corne
      revision: eyelash-corne-shield

    # for sofle hybrid (user fork: WS2812_STRIP fix for Zephyr 4.1.0)
    - name: sofle-hybrid-ergomech-zmk
      remote: unprolix
      path: modules/vendors/ergomech-sofle
      revision: zephyr-4.1-ws2812-fix

    # Rolio46 Gen2 ("Rolio Three") is NOT a west module. The vendor tree
    # (private: git@github.com:MickiusMousius/Rolio2Firmware, branch
    # choc2-revision1) targets Zephyr 3.5 / HWMv1 and cannot be consumed
    # directly by this Zephyr 4.1 workspace. The board and shields are
    # vendored and forward-ported under config/boards instead:
    #   config/boards/rolio/rolio3          (board, migrated to HWMv2)
    #   config/boards/shields/rolio         (rolio_left / rolio_right)
    #   config/boards/shields/vista508      (144x168 Sharp display)
    # Vendored from choc2-revision1 @ a17d0da (2026-08-07).

    # for default layer
    - name: zmk-userspace
      remote: elpekenin
      revision: main
      path: modules/zmk/zmk-userspace

    - name: zmk-adaptive-key
      path: modules/zmk/adaptive-key
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
    - name: zmk-helpers
      path: modules/zmk/helpers
    # User fork: adds a zmk_leader_state_changed event plus candidate accessors
    # so the display can show an in-progress leader sequence and what can still
    # be typed. Upstream (urob) keeps all of that in file-scope statics and
    # raises no events, so none of it is observable.
    #
    # Also tabulates the sequence names on BOTH halves of a split. The
    # behaviour itself is central-only, so without this a peripheral display
    # cannot name a candidate; with it, only indices need crossing the link.
    - name: zmk-leader-key
      remote: unprolix
      revision: 9fbd41de82a48d8188297277b6d793d096349f1f
      path: modules/zmk/leader-key
    - name: zmk-tri-state
      path: modules/zmk/tri-state
    - name: zmk-unicode
      path: modules/zmk/unicode

    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
      path: modules/zmk/zmk-raw-hid

    - name: zmk-antecedent-morph
      remote: ssbb
      revision: v1.0.1
      path: modules/zmk/zmk-antecedent-morph

    # Sharp LS0XX display driver fork: software VCOM plus a native rotate-180
    # property. The Rolio's panel is mounted upside down, and LVGL cannot
    # software-rotate a 1-bit display (lv_draw_sw_rotate handles L8/RGB565/
    # RGB888/XRGB8888 only), so the rotation has to happen in the driver.
    - name: zmk-ls0xxvcom-driver
      remote: mickiusmousius
      revision: fc2043152a0b442d3109fca02955c8c64371e96b  # main as of 2026-08-21
      path: modules/drivers/ls0xxvcom

    # for beekeeb toucan2 trackpad (shield is vendored in config/boards/shields/toucan)
    - name: zmk_driver_azoteq
      remote: beekeeb
      revision: c329f309b7481e5723603550b15f48e24d0c8a6a  # main as of 2026-08-15
      path: modules/drivers/azoteq
    - name: zmk-input-zoom
      remote: beekeeb
      revision: 91bbe0c0e02145da50c9df798489479d28be1804  # main as of 2026-08-15
      path: modules/zmk/input-zoom

    # Only source necessary Zephyr modules. Remove this entire section to restore
    # the default (needed for less common hardware).
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - hal_rpi_pico
          - hal_stm32
          - lvgl
          - mbedtls   # required by BT_CRYPTO in Zephyr 4.1.0
          - tinycrypt

  self:
    path: config
