# go to sleep after one hour (1*60*60*1000ms)

# Zephyr 4.1.0 routes BT crypto through PSA; enable mbedtls PSA crypto client
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Some symbols (BT_CTLR, KSCAN, SOC_DCDC_NRF52X) are deprecated in Zephyr 4.1.0
# but the eyelash_corne board defconfigs and ZMK still use them. Suppress to build.
CONFIG_WARN_DEPRECATED=n

# Hang investigation: workqueue stack overflows when combos fire chains of
# sticky-key → hold-tap → macro. Matches ZMK upstream issue #3100. Bumping
# the workqueue stack and BLE thread stack from defaults (3072 / 768) per
# upstream's recommended workaround.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_WS2812_STRIP_SPI=y  # was WS2812_STRIP, split per-bus in Zephyr 4.1.0
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# RGB Matrix is not defined in ZMK, using underglow instead

CONFIG_BT_DEVICE_NAME="Eyelash Corne"
CONFIG_ZMK_KEYBOARD_NAME="Eyelash Corne"
# NOTE: enabling NKRO causes weird problems when connection is via bluetooth.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

CONFIG_ZMK_LEADER_MAX_SEQUENCES=134



#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100


# Uncomment the following line to increase the keyboard's wireless range
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# following two lines for trying gem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

