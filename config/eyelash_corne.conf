CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118

# Release debounce, raised from ZMK's default of 5ms.
#
# Measured on the bureau's H key: a deliberate press reports down and up 1-2ms
# apart, and 7-15ms after the release a second press arrives holding 15-44ms.
# That is contact bounce on the way open, landing just outside a 5ms window --
# the keymap emits one keystroke and the matrix reports two.
#
# 20ms costs nothing that can be typed. It only delays the report of a release,
# and no finger lifts and returns inside a fiftieth of a second; a switch that
# needs longer than this wants replacing rather than a bigger number.
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# Press debounce is left at the default. Raising it to 10ms was measured and
# made things worse, not better: deliberate presses a second apart began
# reporting 2ms holds, where at the default the same test reported the 60-75ms
# a finger actually produces. Whatever the doubling is, this is not the knob.

# Give the display its own thread instead of the system workqueue.
#
# This is the cause of the phantom 2-3ms key contacts, and it is not a debounce
# problem -- it is a problem with the clock the debouncer is handed.
#
# ZMK scans the matrix from a delayable work item on the SYSTEM workqueue
# (kscan_gpio_matrix.c), rearmed each pass with an ABSOLUTE deadline of
# scan_time += debounce-scan-period-ms (1ms), and calls zmk_debounce_update()
# with that NOMINAL 1ms rather than the time that actually elapsed. Zephyr
# floors a past-due absolute timeout at one tick (kernel/timeout.c:124), and on
# nRF52 a tick is 1/32768s = 30.5us. So every scan the queue was too busy to run
# is not dropped, it is owed -- and the backlog is then drained back to back at
# 30.5us apiece with each one still crediting the debouncer a full millisecond.
# Through a drain the debounce window is up to 32x shorter in real time than it
# reads: 5ms press becomes 153us, 20ms release becomes 610us. Real switch bounce
# is 1-5ms, so it walks straight through as extra press/release pairs. That is
# also why a reported hold can be shorter than the debounce interval, which is
# arithmetically impossible while the scan is on time.
#
# What blocks that queue here is this shield's own screen. nice_view_jjb keeps
# two 68x160 L8 canvases, and every widget update redraws the lot, rotates it,
# blits it down to 1 bit and lv_obj_invalidate()s the whole panel -- a full
# 160x68 frame over SPI at the 1MHz nice_view.overlay sets, about 12ms of
# blocking transfer. ZMK's display work runs on k_sys_work_q by default
# (app/src/display/main.c, zmk_display_work_q()), on a 10ms timer, and the
# widgets it redraws are mods, WPM and layer -- all driven by typing. So the
# blockage is anchored to exactly the keystrokes that then get mis-debounced.
#
# The keymap pipeline shares that queue too (physical_layouts.c submits the
# kscan msgq processor with k_work_submit and raises the position event from
# it), but that work is short; the 12ms panel flush is the one worth moving.
# Underglow and rgbzone already run on ZMK's low-priority queue and are not
# implicated -- which is why switching the lighting off changed nothing.
#
# The dedicated display thread runs at priority 5, preemptible, so the system
# workqueue (priority -1, cooperative) can now run the scan while a frame is
# still going out over SPI.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# ZMK defaults this thread to 3072 bytes. The canvas rotate-and-blit path plus
# LVGL label rendering currently runs on the system workqueue stack, which is
# raised to 8192 above; do not hand the same code a quarter of that.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=6144
