# Corne v4 per-key lighting WITH the USB console, for working out why a picture
# will not settle. rgbkey_corne_v4.conf and corne_v4_debug.conf, concatenated --
# a .conf cannot include another, and EXTRA_CONF_FILE takes one path through the
# Justfile's cmake-args, so the only way to have both is to have both here.
#
# When either of those two moves, this file has to move with it.
#
# What to watch: rgbkey logs "layer=... scene=... mods=... caps=..." on CHANGE.
# A picture that will not settle shows the same few lines repeating, and says
# which input is moving -- the layer, the modifiers, or caps.

# Per-key lighting build for the Corne v4.
#
# Everything here exists to stop ZMK's underglow touching the LED chain behind
# rgbkey's back. The config directory outranks a shield's .conf, so these have
# to be applied as an EXTRA_CONF_FILE to beat corne_v4.conf, which turns
# underglow on for the ordinary build.

# Underglow stays COMPILED IN -- disabling it in Kconfig also removes the things
# it selects (LED_STRIP, the WS2812 PIO backend), so the chain would end up with
# no driver at all and corne_v4.conf's own underglow settings would then abort
# the build as unmet dependencies. rgbkey takes the strip at runtime instead.
CONFIG_ZMK_RGB_UNDERGLOW=y

# ...but it must never start, and must never come BACK. Calling
# zmk_rgb_underglow_off() once is not enough on its own: with AUTO_OFF_IDLE the
# underglow restores whatever it was doing before the keyboard went idle, so it
# returns at the next keypress and animates over rgbkey's writes. Two writers on
# one chain shows up as the right key lighting in the wrong colour at a
# wandering brightness, not as an error.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# ...and none of the three above is sufficient on their own, because SETTINGS
# outranks all of them. ZMK's underglow persists its on/off state
# (SETTINGS_STATIC_HANDLER_DEFINE(rgb_underglow, "rgb/underglow", ...)) and
# restores it at init, where `if (state.on) k_timer_start(&underglow_tick,
# K_NO_WAIT, K_MSEC(50))` starts a timer that repaints the WHOLE strip twenty
# times a second -- solid effects included.
#
# corne_v4.conf turns underglow on for the ordinary build, so the first plain
# flash saves "on", and every rgbkey build afterwards restored it and had its
# pixels overwritten within 50ms of drawing them. What that looks like is the
# right half stuck on dim red for ever (HUE_START=0, BRT_START=20 -- underglow's
# own default, not any colour in rgbkey's palette) and home-row mods that never
# appear to light at all.
#
# So the persistence goes. Nothing else on this board needs it: there is no
# radio, hence no BLE profiles to remember, and rgbkey's own picture is derived
# from the live layer and modifiers every time.
CONFIG_SETTINGS=n

# Unlike the Rolio there is no power gate to own: this board's chain is wired
# straight to the rail, so CONFIG_ZMK_BACKLIGHT is absent and rgbkey_strip.c's
# set_gate() compiles down to its no-gate branch. Nothing to configure, but it
# is the reason nothing here mentions the backlight.
#
# It also means an all-dark layer is not free the way it is on the Rolio -- the
# emitters are still powered, just told to show black. That is a few milliamps
# of quiescent draw, not the ~180mA of a lit layer, so it is not worth chasing.

# Appended by scripts/adjust_leader_config.sh; kept here so it does not re-add
# a copy after every CONFIG_ZMK_ line the next time it sees this file.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=134
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118

# Corne v4 bring-up logging. Extra conf for the -debug targets, paired with the
# zmk-usb-logging snippet -- the snippet supplies the zephyr,cdc-acm-uart node
# and the console chosen-nodes, which is why this file does not set
# CONFIG_ZMK_USB_LOGGING itself. Setting that alone does not work here: the
# rpi_pico board disables uart0, so with no CDC node in the devicetree Kconfig
# fails outright on USB_CDC_ACM and UART_CONSOLE being selected without their
# dependencies.
#
# Use it one half at a time: whichever half holds the USB cable powers the other
# over the interlink, so there is never a reason -- and never permission -- to have
# both halves on USB at once.
#
# What to look for, with the wired split silent:
#
#   central  "TX Bytes" hexdumps every ~15ms, and a turnaround line whose rx
#            count stays 0  -> the central is talking and hearing nothing back
#   periph   a turnaround line whose rx count stays 0
#            -> nothing is arriving; suspect the wire, the pin, or the baud
#   periph   rx climbing but no reply
#            -> bytes arrive but the frame is rejected; suspect CRC, i.e.
#               framing/timing rather than connectivity
#
# The driver's own init line reports the pin, baud and clock divider it actually
# came up with, which is worth confirming before reading anything into silence.

# INF, not DBG. At DBG the behaviour-init chatter alone dropped 577 messages at
# boot and buried the split driver's own init line; the interesting lines are
# precisely the ones that get lost. The driver reports its counters at INF on a
# timer instead, which says everything the DBG hexdumps would.
#
# BOTH SYMBOLS ARE NEEDED, and the choice on its own does NOTHING.
# LOG_MODULE_DECLARE(zmk, CONFIG_ZMK_LOG_LEVEL) compiles against the integer,
# and zmk/app/Kconfig:555 has
#
#     if !ZMK_LOGGING_MINIMAL
#     config ZMK_LOG_LEVEL
#         default 4        # 4 == DBG
#     endif
#
# whose default is reached before the log_config template's `default 3 if
# ZMK_LOG_LEVEL_INF`, so a build setting only the choice still comes out at DBG
# -- .config read `CONFIG_ZMK_LOG_LEVEL=4` with `CONFIG_ZMK_LOG_LEVEL_INF=y`
# directly above it. The integer cannot be assigned here either; it is
# promptless, and Kconfig fails the build outright. ZMK_LOGGING_MINIMAL is the
# switch: it drops the `default 4` and lets the choice decide.
#
# What DBG costs on this board: the wired split's poll_out hexdump runs at
# ~66Hz, which is 83000 lines in five minutes, and the deferred backend drops
# everything else -- including every line these files exist to read.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

# The split transport hexdumps at debug level and the log backend is slower than
# the traffic; without room here the interesting lines are the ones dropped.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_DEFERRED=y

# Declared, not because this file needs them -- corne_v4.conf already sets both
# -- but because scripts/adjust_leader_config.sh rewrites every config/*.conf,
# and its "symbol absent" path is `sed /CONFIG_ZMK_.*=/a`, which appends after
# EVERY matching line rather than once. Having the symbols already present sends
# it down the substitute path instead, so this file stops accumulating copies.
