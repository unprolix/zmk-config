#
# Carries a host-driven LED poke to split peripherals, so the far half's strip
# can be exercised directly during diagnosis. GLOBAL locality is what makes ZMK
# relay it.
#
# param1 is the command; param2 packs index and colour, one byte each.

description: Relay a direct LED poke to split peripherals

compatible: "zmk,behavior-rgb-diag"

include: two_param.yaml
