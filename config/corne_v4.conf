# foostan Corne v4 (rev 4.1, standard 3x6+3) — shared-layout build.
# The split link and its polling mode live in the vendored shield confs
# (config/boards/shields/corne_v4/corne_v4_{left,right}.conf).

# Some symbols are deprecated in Zephyr 4.1.0 but ZMK still uses them.
CONFIG_WARN_DEPRECATED=n

# Workqueue stack overflows when combos fire chains of sticky-key -> hold-tap ->
# macro (ZMK upstream issue #3100); same bump as every other board here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# CONFIG_ZMK_KEYBOARD_NAME is deliberately NOT set here. It lives in the two
# shield confs instead, so that the halves enumerate under different names --
# which is the only way to tell after the fact that the right image went onto
# the right half. A user conf overrides a shield conf, so setting it here would
# make both halves identical again.

# NKRO is safe here in a way it is not on the wireless boards: this keyboard
# only ever speaks USB.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

CONFIG_ZMK_LEADER_MAX_SEQUENCES=134
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118

# 23 WS2812s per half, one under each key plus the two at the expansion
# position. Genuinely per-key, unlike the eyelash's six-zone columns.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Cap brightness at 20%, matching foostan's own `max_brightness: 50` (of 255)
# in QMK's crkbd/rev4_1/info.json. Not an aesthetic choice: all 46 LEDs draw
# from the ONE USB port in the left half, since the right half is powered over
# the interlink. At full brightness that is roughly 900mA for red alone and more for
# white, against a 500mA port budget -- brownout territory, not just bright.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# On the wireless boards CONFIG_SETTINGS arrives with the BLE stack. There is no
# BLE stack here, so ask for it explicitly -- otherwise the underglow colour and
# brightness reset on every power cycle. The rpi_pico board already provides NVS
# on the QSPI flash; corne_v4.dtsi un-marks its settings partition read-only.
CONFIG_SETTINGS=y

# Mouse keys. The shared NAVIGATION layer puts scroll on the innermost column
# (&msc_up_variable / &msc_down_variable) and the mouse buttons on its bottom
# row (&mkp MB2..MB5), and none of it works without ZMK_POINTING.
#
# There is no pointing DEVICE on this board -- no trackpad, no roller -- which
# is why this was missed: the Rolio picks the symbol up as a side effect of
# CONFIG_ZMK_MOUSE=y for its Cirque, and the eyelash for its joystick. Mouse
# KEYS are a keymap feature and need it just the same.
#
# It fails silently, which is the part worth remembering. behaviors.dtsi still
# declares &msc and &mkp with ZMK_POINTING off, so the keymap builds clean and
# every one of those keys simply does nothing when pressed.
CONFIG_ZMK_POINTING=y
