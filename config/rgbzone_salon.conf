CONFIG_ZMK_KEYBOARD_NAME="Salon Corne"
CONFIG_ZMK_LEADER_MAX_SEQUENCES=132

CONFIG_USB_DEVICE_MANUFACTURER="jjb"
CONFIG_USB_DEVICE_PRODUCT="Salon Corne"
CONFIG_USB_DEVICE_VID=0xBEEF
CONFIG_USB_DEVICE_PID=0xC00A

CONFIG_BT_DEVICE_NAME="Salon Corne"
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118

# Per-column lighting drives the LED strip directly, so ZMK's underglow has to
# stay out of the way -- two writers on one chain look like the wrong colour at
# a wandering brightness, which is exactly what its breathe effect produces.
#
# Calling zmk_rgb_underglow_off() at runtime is not enough on its own:
# AUTO_OFF_IDLE restores whatever underglow was doing before the keyboard went
# idle, so it switches itself back on at the next keypress. These are
# sub-options of ZMK_RGB_UNDERGLOW, which stays enabled -- disabling that
# outright would take LED_STRIP, the WS2812 SPI backend, SPI and ext-power with
# it, leaving the chain with no driver at all.
#
# They live here rather than in the rgbzone shield because
# config/eyelash_corne.conf sets AUTO_OFF_IDLE=y and the config directory
# outranks a shield; an EXTRA_CONF_FILE is applied last and wins.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
