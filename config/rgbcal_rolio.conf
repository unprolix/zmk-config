# RGB calibration build for the Rolio.
#
# Pairs of "which LED in the chain sits under which key" cannot be read off any
# vendor source for this board -- see config/boards/shields/rolio/rolio.dtsi,
# where four of six matrix values in the vendor tree were wrong. Derive the LED
# map the same way the matrix was derived: empirically.
#
# Underglow is deliberately LEFT ENABLED. Disabling it in Kconfig also removes
# the things it selects -- LED_STRIP, the WS2812 SPI backend, SPI and the
# external-power wiring -- so the chain ends up with no driver at all, and
# rolio.conf's own underglow settings then warn as unmet dependencies and abort
# the build. rgbcal turns it off at runtime instead and drives the strip
# directly.
CONFIG_ZMK_RGB_UNDERGLOW=y

# THE ONE ROLIO-SPECIFIC LINE.
#
# On the eyelash the strip runs off switched external power, which rgbcal
# raises itself through the ext_power driver. On this board it does not: the
# "backlight" PWM channel on P1.13 is the underglow power gate (rolio.dtsi sets
# zmk,backlight = &underglow_power), and rolio.conf leaves it off at boot.
# rgbcal knows nothing about backlight gates, so without this the chain stays
# dark no matter what is written to it and the run looks like dead hardware.
CONFIG_ZMK_BACKLIGHT_ON_START=y

# Idle auto-off would cut the gate part-way through a calibration run, which
# reads as "the LEDs stopped working" rather than as a timeout.
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# Appended by scripts/adjust_leader_config.sh; kept here so it does not re-add
# a copy after every CONFIG_ZMK_ line the next time it sees this file.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=132
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=118
